services:
  - type: web
    name: civicfix-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PROTOCOL
        value: https
      - key: API_HOST
        fromService:
          type: web
          name: civicfix-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DB_SYNC
        value: "true"

databases:
  - name: civicfix-db
    plan: free
    region: singapore
    databaseName: civicfix
    postgresMajorVersion: "17"
