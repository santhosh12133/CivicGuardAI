services:
  - type: web
    name: civicfix-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PROTOCOL
        value: https
      # API_HOST is intentionally not set: photo URLs use the public hostname
      # Render forwards in the Host header. Set it only for a custom domain.
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set in the dashboard to your admin portal URL, e.g.
      # https://civicfix-admin.vercel.app (no trailing slash; comma-separate several).
      - key: CORS_ORIGINS
        sync: false
      # Creates any missing tables on start (including the photos table).
      - key: DB_SYNC
        value: "true"

# NOTE: Render's free Postgres expires 30 days after creation and is deleted
# 14 days later. For anything beyond a trial, upgrade it to a paid plan or
# point DATABASE_URL at another provider (see DEPLOYMENT.md).
databases:
  - name: civicfix-db
    plan: free
    region: singapore
    databaseName: civicfix
    postgresMajorVersion: "17"
