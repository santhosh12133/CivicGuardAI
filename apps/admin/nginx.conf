# Static admin portal. TLS, compression and the public address are handled by Caddy in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path loads index.html, which must not be cached
    # so a new deploy is picked up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
