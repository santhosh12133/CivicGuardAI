appId: com.civicfix.app
name: Sign up, browse issues, filter by category, open an issue
---
- launchApp:
    clearState: true
- runFlow: _dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 150000
- assertVisible: "Server: .*"
- takeScreenshot: 01-login
- tapOn:
    id: "go-to-signup"
- tapOn:
    id: "signup-name"
- inputText: "Meera Citizen"
- tapOn:
    id: "signup-email"
- inputText: ${NEW_EMAIL}
- tapOn:
    id: "signup-password"
- inputText: "meera-password-1"
- tapOn:
    id: "signup-confirm"
- inputText: "meera-password-1"
- hideKeyboard
- takeScreenshot: 01-signup
- tapOn:
    id: "signup-submit"
- extendedWaitUntil:
    visible: "Hello, Meera"
    timeout: 60000
# Newest first: the garbage report is at the top, the pothole further down.
- assertVisible: "Garbage pile on 5th Cross"
- scrollUntilVisible:
    element: "Deep pothole on MG Road"
    direction: DOWN
- takeScreenshot: 01-home
- scrollUntilVisible:
    element:
      id: "filter-category-pothole"
    direction: UP
# Category filter
- tapOn:
    id: "filter-category-pothole"
- assertVisible: "Deep pothole on MG Road"
- assertNotVisible: "Garbage pile on 5th Cross"
- assertNotVisible: "Streetlight out near bus stop"
- takeScreenshot: 01-filtered
# Issue details are public, but this is not Meera's report
- tapOn: "Deep pothole on MG Road"
- extendedWaitUntil:
    visible:
      id: "issue-detail"
    timeout: 30000
- assertVisible: "Pothole"
- assertVisible: "Reported"
- assertNotVisible: "Your report"
- takeScreenshot: 01-detail
- back
- tapOn:
    id: "filter-category-all"
- assertVisible: "Garbage pile on 5th Cross"
# My reports is empty for a new account
- tapOn: "My reports"
- extendedWaitUntil:
    visible: "You haven't reported anything yet."
    timeout: 30000
- takeScreenshot: 01-my-reports-empty
