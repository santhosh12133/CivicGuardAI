appId: com.civicfix.app
name: Change password, sign out, sign in with the new password
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome Back.*"
    timeout: 150000
- tapOn:
    id: "login-email"
- inputText: ${RAVI_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${RAVI_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Hello, Ravi"
    timeout: 60000
- tapOn: "Profile"
- assertVisible: "Ravi Citizen"
- tapOn:
    id: "change-password"
- tapOn:
    id: "password-current"
- inputText: ${RAVI_PASSWORD}
- tapOn:
    id: "password-new"
- inputText: "ravi-new-password-2"
- tapOn:
    id: "password-confirm"
- inputText: "ravi-new-password-2"
- hideKeyboard
- tapOn:
    id: "password-save"
- extendedWaitUntil:
    visible: "Password changed"
    timeout: 30000
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Welcome Back.*"
    timeout: 30000
# The old password no longer works
- tapOn:
    id: "login-email"
- inputText: ${RAVI_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${RAVI_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Invalid credentials"
    timeout: 30000
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Welcome Back.*"
    timeout: 150000
- tapOn:
    id: "login-email"
- inputText: ${RAVI_EMAIL}
- tapOn:
    id: "login-password"
- inputText: "ravi-new-password-2"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Hello, Ravi"
    timeout: 60000
- takeScreenshot: 04-signed-in-again
