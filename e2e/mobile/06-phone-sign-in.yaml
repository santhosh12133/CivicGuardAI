appId: com.civicfix.app
name: Sign in with a phone number and SMS code, then set a password
---
- launchApp:
    clearState: true
- runFlow: _dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: "Welcome Back.*"
    timeout: 150000
- scrollUntilVisible:
    element:
      id: "go-to-phone"
    direction: DOWN
- tapOn:
    id: "go-to-phone"
- assertVisible: "Sign in with your phone"
- tapOn:
    id: "phone-number"
- inputText: ${TEST_PHONE_NUMBER}
- hideKeyboard
- tapOn:
    id: "phone-send"
- extendedWaitUntil:
    visible:
      id: "phone-code"
    timeout: 60000
- tapOn:
    id: "phone-code"
- inputText: ${TEST_PHONE_CODE}
- tapOn:
    id: "phone-name"
- inputText: "Phone Citizen"
- hideKeyboard
- tapOn:
    id: "phone-verify"
- extendedWaitUntil:
    visible: "Hello, Phone"
    timeout: 60000
- takeScreenshot: 06-phone-signed-in
# A phone-only account has no password yet and can set one.
- tapOn: "Profile"
- assertVisible: "Phone Citizen"
- assertVisible: "\\+919999900001"
- tapOn:
    id: "change-password"
- assertNotVisible:
    id: "password-current"
- tapOn:
    id: "password-new"
- inputText: "phone-user-pass-1"
- tapOn:
    id: "password-confirm"
- inputText: "phone-user-pass-1"
- hideKeyboard
- tapOn:
    id: "password-save"
- extendedWaitUntil:
    visible: "Password set.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "sign-out-everywhere"
    direction: DOWN
- tapOn:
    id: "sign-out-everywhere"
- extendedWaitUntil:
    visible: "Welcome Back.*"
    timeout: 30000
- takeScreenshot: 06-signed-out-everywhere
