appId: com.civicfix.app
name: Sign in with a phone number and SMS code, set a password, sign out everywhere
---
- launchApp:
    clearState: true
- runFlow: _dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 150000
- scrollUntilVisible:
    element:
      id: "go-to-phone"
    direction: DOWN
- tapOn:
    id: "go-to-phone"
- assertVisible: "Sign in with your phone"
- tapOn:
    id: "phone-number"
- inputText: ${TEST_PHONE_NUMBER}
- hideKeyboard
- tapOn:
    id: "phone-send"
- extendedWaitUntil:
    visible:
      id: "phone-code"
    timeout: 60000
- tapOn:
    id: "phone-code"
- inputText: ${TEST_PHONE_CODE}
- tapOn:
    id: "phone-name"
- inputText: "Phone Citizen"
- hideKeyboard
- tapOn:
    id: "phone-verify"
- extendedWaitUntil:
    visible: "Hello, Phone"
    timeout: 60000
- takeScreenshot: 06-phone-signed-in
# A phone-only account has no password yet and can set one. (On a retry the
# account already has one, so the current-password field is filled in too.)
- tapOn: "Profile"
- assertVisible: "Phone Citizen"
- assertVisible: "\\+919999900001"
- tapOn:
    id: "change-password"
- runFlow:
    when:
      visible:
        id: "password-current"
    commands:
      - tapOn:
          id: "password-current"
      - inputText: "phone-user-pass-1"
- tapOn:
    id: "password-new"
- inputText: "phone-user-pass-1"
- tapOn:
    id: "password-confirm"
- inputText: "phone-user-pass-1"
- hideKeyboard
- tapOn:
    id: "password-save"
- extendedWaitUntil:
    visible: "Password (set|changed).*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "sign-out-everywhere"
    direction: DOWN
- tapOn:
    id: "sign-out-everywhere"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- takeScreenshot: 06-signed-out-everywhere
