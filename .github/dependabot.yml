# Weekly dependency update pull requests, grouped so there are only a few.
# Expo/React Native versions are tied to the Expo SDK and are upgraded with
# `npx expo install --fix` instead, so Dependabot leaves them alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      admin-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e/admin
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
