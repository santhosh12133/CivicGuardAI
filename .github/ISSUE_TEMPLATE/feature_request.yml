name: Feature request
description: Suggest an improvement for citizens, staff or operators.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes the API contract
        - label: Changes the database schema
        - label: Collects or exposes personal data
        - label: Needs new infrastructure or configuration
