name: Lockfile sync (temporary)

# Regenerates apps/admin/package-lock.json after dependencies are added to package.json on a branch,
# for contributors without npm registry access. Commits only when the lock file changes.
on:
  push:
    branches-ignore: [main]
    paths: ["apps/admin/package.json"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update the lock file
        working-directory: apps/admin
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit if changed
        run: |
          if git diff --quiet apps/admin/package-lock.json; then echo "Lock file already in sync"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/package-lock.json
          git commit -m "chore(admin): sync package-lock.json"
          git push
