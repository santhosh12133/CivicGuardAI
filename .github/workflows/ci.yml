name: CivicFix CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/civicguard_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "18.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Syntax check backend
        working-directory: backend
        run: node --check server.js
      - name: Run backend tests
        working-directory: backend
        run: npm test

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci
      - name: Build admin portal
        working-directory: admin
        env:
          # The production build refuses to run without an API URL.
          VITE_API_URL: https://api.example.invalid/api
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Validate Expo configuration
        working-directory: mobile
        run: npx expo config --type public

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint CloudFormation templates
        run: |
          pip install --quiet cfn-lint
          cfn-lint --version
          cfn-lint infra/aws/*.yml
      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: Build the API container image
        run: docker build --pull -t civicfix-api:ci backend
      - name: Check the image starts and has the RDS CA bundle
        run: |
          docker run --rm -e DATABASE_URL=postgres://x:y@127.0.0.1:1/z -e JWT_SECRET=0123456789abcdef0123456789abcdef \
            civicfix-api:ci node -e "
              const ca = require('fs').readFileSync('/app/certs/rds-global-bundle.pem', 'utf8');
              if (!ca.includes('BEGIN CERTIFICATE')) throw new Error('CA bundle missing');
              require('/app/src/app.js').createApp();
              console.log('image ok');
              process.exit(0);
            "
