AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CivicFix one-time setup. Lets the repository's GitHub Actions deploy to this
  AWS account using GitHub's OpenID Connect login, so no AWS access keys are
  ever created or stored. Create this stack once in the CloudFormation console.

Parameters:
  GitHubRepository:
    Type: String
    Default: santhosh12133/CivicGuardAI
    Description: owner/name of the GitHub repository allowed to deploy (case-sensitive).
  DeployBranch:
    Type: String
    Default: main
    Description: Only workflows running on this branch can deploy.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false if this account already has an IAM identity provider for
      token.actions.githubusercontent.com (an account can only have one).

Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: civicfix-github-deploy
      Description: Assumed by GitHub Actions in the CivicFix repository to deploy the app.
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${DeployBranch}
      # Broad service permissions (everything except IAM and account
      # management); IAM access is limited to roles named civicfix-*.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: civicfix-iam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageCivicFixRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/civicfix-*
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:GetRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*

Outputs:
  DeployRoleArn:
    Description: Add this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
